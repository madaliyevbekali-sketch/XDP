<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O‘zbekiston Xalq demokratik partiyasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090D;--bg2:#11131B;--a:#A35CFF;--a2:#6D35D9;--al:#E7B8FF;--t:#F5F0FF;--t2:rgba(245,240,255,.68);--bd:rgba(245,240,255,.16);--gl:rgba(255,255,255,.045);
--hd:'Marcellus','Cormorant Garamond',Georgia,serif;--sf:'Cormorant Garamond',Georgia,serif;--ui:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t);font:400 1.0625rem/1.7 var(--ui);overflow-x:hidden;min-height:100svh}
body::before,body::after{content:"";position:fixed;z-index:-1;width:90vmax;height:90vmax;border-radius:50%;pointer-events:none;will-change:transform}
body::before{left:-35vmax;top:-45vmax;background:radial-gradient(closest-side,rgba(163,92,255,.16),transparent);animation:drift 28s ease-in-out infinite alternate}
body::after{right:-40vmax;bottom:-50vmax;background:radial-gradient(closest-side,rgba(109,53,217,.17),transparent);animation:drift 34s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate3d(8vmax,5vmax,0)}}
a{color:inherit}
:focus-visible{outline:2px solid var(--al);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--bg2);padding:8px 14px;z-index:99}
/* INTRO */
#intro{position:fixed;inset:0;height:100vh;height:100svh;z-index:50;background:#030305;display:grid;place-items:center;overflow:hidden;transition:opacity 1.6s ease}
#intro.out{opacity:0;pointer-events:none}
#intro .core{position:absolute;width:70vmin;height:70vmin;left:50%;top:50%;margin:-35vmin 0 0 -35vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(163,92,255,calc(.07 + var(--lv,0)*.16)),transparent);transition:background 1.5s ease;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12)}}
.w{position:absolute;left:50%;top:50%;width:92vw;max-width:1200px;text-align:center;font-family:var(--hd);text-transform:uppercase;line-height:1.12;letter-spacing:.05em;overflow-wrap:anywhere;
 font-size:clamp(2rem,9vw,7rem);color:var(--t);opacity:0;filter:blur(14px);transform:translate(-50%,-50%) scale(.96);
 transition:opacity 1.2s ease,filter 1.2s ease,transform 1.7s cubic-bezier(.2,.7,.2,1);text-shadow:0 0 calc(8px + var(--g,1)*10px) rgba(245,225,255,.45),0 0 calc(24px + var(--g,1)*30px) rgba(163,92,255,calc(.35 + var(--g,1)*.1)),0 0 calc(70px + var(--g,1)*50px) rgba(109,53,217,.35)}
.w::before{content:"";position:absolute;left:50%;top:50%;width:min(120%,1000px);height:300%;transform:translate(-50%,-50%) scale(.55);background:radial-gradient(closest-side,rgba(163,92,255,calc(.16 + var(--g,1)*.07)),rgba(231,184,255,.04) 55%,transparent);opacity:0;z-index:-1;pointer-events:none;transition:opacity 1.3s ease,transform 2s cubic-bezier(.2,.7,.2,1)}
.w.on::before{opacity:1;transform:translate(-50%,-50%) scale(1)}
.w.off::before{opacity:0;transform:translate(-50%,-50%) scale(1.25)}
.w.on{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}
.w.off{opacity:0;filter:blur(6px);transition-duration:.9s,.9s,.9s}
.w.up{transform:translate(-50%,-34%) scale(1)}.w.up.on{transform:translate(-50%,-50%)}
.w.firm{transform:translate(-50%,-50%) scale(1.06);transition-duration:1s,1s,1.2s}.w.firm.on{transform:translate(-50%,-50%)}
.w.big{font-size:clamp(2.2rem,10.5vw,8.5rem)}
.w.tq{font-size:clamp(1.7rem,7.6vw,6.5rem);letter-spacing:.04em}
#skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:none;border:0;color:rgba(245,240,255,.42);font:300 .95rem var(--ui);letter-spacing:.08em;padding:14px 22px;cursor:pointer;transition:color .3s}
#skip:hover{color:var(--t)}
/* SHELL */
header{position:fixed;top:0;left:0;right:0;z-index:20;padding:env(safe-area-inset-top,0) 0 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1240px;margin:12px auto 0;padding:10px 18px;width:calc(100% - 24px);border:1px solid var(--bd);border-radius:22px;background:rgba(17,19,27,.66);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font:500 .66rem/1.25 var(--ui);letter-spacing:.14em;text-transform:uppercase}
nav ul{display:flex;gap:4px;list-style:none;padding:0}
nav a{display:block;padding:10px 12px;border-radius:12px;text-decoration:none;font:400 .76rem var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--t2);transition:.25s}
nav a:hover,nav a[aria-current=page]{color:var(--t);background:rgba(163,92,255,.16)}
#burger{display:none;min-width:48px;min-height:48px;background:none;border:1px solid var(--bd);border-radius:14px;color:var(--t);cursor:pointer}
@media(max-width:900px){#burger{display:block}nav{position:absolute;top:100%;left:0;right:0;margin-top:8px;padding:10px;border:1px solid var(--bd);border-radius:20px;background:rgba(17,19,27,.95);display:none}nav.open{display:block}nav ul{flex-direction:column}nav a{padding:15px 16px;font-size:.88rem}}
main{padding:120px 20px 40px;max-width:1120px;margin:0 auto}
main.anim>*{animation:in .8s ease both}@keyframes in{from{opacity:0;transform:translateY(14px)}}
/* LOGO */
.logo{display:grid;place-items:center;border-radius:50%;border:1px solid rgba(231,184,255,.45);background:radial-gradient(circle at 50% 35%,rgba(163,92,255,.35),rgba(17,19,27,.9));font:400 1rem var(--hd);letter-spacing:.06em;color:var(--al);overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.logo.s{width:44px;height:44px;font-size:.82rem}.logo.l{width:clamp(96px,22vw,150px);height:clamp(96px,22vw,150px);font-size:clamp(1.3rem,4vw,2rem);box-shadow:0 0 60px rgba(163,92,255,.28)}
/* HERO */
.hero{min-height:calc(100svh - 160px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:10px 0 50px}
.eyebrow{font:400 .8rem var(--ui);letter-spacing:.32em;text-transform:uppercase;color:var(--al)}
h1,h2{font-family:var(--hd);font-weight:400;line-height:1.1}
.hero h1{font-size:clamp(2.1rem,8.2vw,5.8rem);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 0 40px rgba(163,92,255,.3);overflow-wrap:anywhere}
.lead{font:400 clamp(1.15rem,2.6vw,1.45rem)/1.55 var(--sf);color:var(--t2);max-width:46rem}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:999px;text-decoration:none;font:500 .82rem var(--ui);letter-spacing:.14em;text-transform:uppercase;transition:.3s;cursor:pointer;border:1px solid}
.btn.p{background:linear-gradient(135deg,var(--a),var(--a2));border-color:rgba(231,184,255,.5);box-shadow:0 8px 30px rgba(163,92,255,.28)}
.btn.s{background:transparent;border-color:var(--bd);color:var(--t)}
.btn:hover{transform:translateY(-2px)}.btn.s:hover{background:rgba(255,255,255,.07)}
.sm{min-height:44px;padding:0 20px;font-size:.74rem}
/* CONTENT */
.page h2{font-size:clamp(2rem,6vw,3.8rem);margin:8px 0 18px;text-transform:uppercase;letter-spacing:.03em}
.kicker{font:400 .8rem var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--al)}
.page .lead{margin-bottom:40px}
.back{display:inline-block;margin-bottom:26px;color:var(--t2);text-decoration:none;font-size:.9rem;padding:8px 0}.back:hover{color:var(--t)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:12px;padding:28px;border:1px solid var(--bd);border-radius:22px;background:var(--gl);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:.3s}
.card:hover{transform:translateY(-4px);border-color:rgba(231,184,255,.5)}
.card h3{font:400 1.35rem/1.25 var(--hd)}.card p{color:var(--t2);flex:1}
.card svg{width:26px;height:26px;stroke:var(--al);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card .btn{align-self:flex-start}
.prose{max-width:44rem;font:400 1.3rem/1.8 var(--sf)}.prose p+p{margin-top:1.2em}
.date{font:400 clamp(4.5rem,20vw,11rem)/.95 var(--hd);text-shadow:0 0 50px rgba(163,92,255,.35)}
.date small{display:block;font-size:.3em;letter-spacing:.2em;color:var(--al);margin-top:10px}
.tl{margin-top:50px;border-left:1px solid var(--bd);padding-left:24px;max-width:40rem}.tl b{font:400 1.2rem var(--hd)}.tl p{color:var(--t2);margin-top:4px}.tl .todo{margin-top:22px;font-style:italic}
.note{margin-top:40px;font-size:.9rem;color:var(--t2);max-width:44rem}
footer{max-width:1120px;margin:40px auto 0;padding:34px 20px calc(34px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:18px 34px;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--t2)}
footer b{font:500 .78rem var(--ui);letter-spacing:.14em;color:var(--t)}footer div{display:flex;flex-wrap:wrap;gap:6px 22px}
footer a,footer button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:4px}
@media(max-width:480px){main{padding-top:104px}.card{padding:22px}.brand span{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<a class="skip" href="#app">Asosiy mazmunga o‘tish</a>
<div id="intro" role="presentation" aria-label="Kirish animatsiyasi"><div class="core"></div><div id="stage" aria-hidden="true"></div><button id="skip" type="button">O‘tkazib yuborish →</button></div>
<header id="hdr" hidden><div class="bar">
<a class="brand" href="#/" aria-label="Bosh sahifa"><span class="logo s" data-logo>XDP</span><span>O‘zbekiston<br>Xalq demokratik partiyasi</span></a>
<button id="burger" type="button" aria-label="Menyuni ochish" aria-expanded="false" aria-controls="nav">☰</button>
<nav id="nav" aria-label="Asosiy menyu"><ul></ul></nav></div></header>
<main id="app" tabindex="-1" hidden></main>
<footer id="ft" hidden></footer>
<script>
/* ===== MA'LUMOTLAR ===== */
// Rasmiy logotip faylini shu yerga yozing (masalan "xdp-logo.png" yoki data: URL). Bo'sh bo'lsa — vaqtinchalik "XDP" belgisi chiqadi.
const LOGO_SRC="";
const L={site:"https://xdp.uz/",history:"https://xdp.uz/history",ustav:"https://www.xdp.uz/ustav",dastur:"https://www.xdp.uz/saylovoldi-dastur"};
const IC={shield:"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.500-1.200 6.240-2.720a1.170 1.170 0 0 1 1.520 0C14.510 3.810 17 5 19 5a1 1 0 0 1 1 1z",eq:"M5 9h14M5 15h14",heart:"M19 14c1.490-1.460 3-3.210 3-5.500A5.500 5.500 0 0 0 16.500 3c-1.760 0-3 .5-4.500 2-1.500-1.500-2.740-2-4.500-2A5.500 5.500 0 0 0 2 8.500c0 2.300 1.500 4.050 3 5.500l7 7Z",users:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.870M16 3.130a4 4 0 0 1 0 7.750",file:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6",scale:"M12 3v18M5 7h14M5 7l-3 8a4 4 0 0 0 6 0zM19 7l-3 8a4 4 0 0 0 6 0z",globe:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"};
const ico=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
const NAV=[["/","Bosh sahifa"],["/about","Partiya haqida"],["/activity","Faoliyat"],["/history","Tarix"],["/docs","Hujjatlar"],["/contact","Aloqa"]];
const SCENES=[["XALQ","",2800,1,.5],["ISHONCH","up",2300,1.2,.6],["BIRLIK","firm",2300,1.6,.8],["TARAQQIYOT","tq",2600,2,1],["XALQ UCHUN.","big",1900,2.2,1],["BIRLIKDA.","big",1900,1.8,1],["KELAJAK SARI!","big firm",3400,2.8,1.2]];
/* ===== YORDAMCHI ===== */
const $=s=>document.querySelector(s);
const logoHTML=(c)=>`<span class="logo ${c}" data-logo>${LOGO_SRC?`<img src="${LOGO_SRC}" alt="XDP logotipi">`:"XDP"}</span>`;
const card=(i,t,p,href,ext)=>`<article class="card">${ico(i)}<h3>${t}</h3><p>${p}</p><a class="btn s sm" href="${href}" ${ext?'target="_blank" rel="noopener noreferrer"':""}>${ext?"Rasmiy manbani ochish":"Batafsil"}</a></article>`;
const page=(k,h,lead,body)=>`<section class="page"><a class="back" href="#/">← Bosh sahifaga qaytish</a><p class="kicker">${k}</p><h2>${h}</h2><p class="lead">${lead}</p>${body}</section>`;
const src=(u,t)=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`;
/* ===== SAHIFALAR ===== */
const PAGES={
"/":()=>`<section class="hero">
<p class="eyebrow">O‘zbekiston</p>${logoHTML("l")}
<h1>XALQ Demokratik Partiyasi</h1>
<p class="lead">O‘zbekiston Xalq demokratik partiyasi — ijtimoiy himoya, ijtimoiy adolat va ehtiyojmand aholi qatlamlari manfaatlarini himoya qilishga yo‘naltirilgan siyosiy partiya.</p>
<div class="btns"><a class="btn p" href="#/about">Partiya haqida</a><a class="btn s" href="#/goals">Faoliyat yo‘nalishlari</a></div></section>
<div class="grid">${card("users","XDP haqida","Partiya va uning Ustavdagi asosiy maqsadi haqida qisqacha.","#/about")}${card("file","Partiya tarixi","Tashkil topgan sana va tarixiy ma’lumot.","#/history")}${card("shield","Maqsad va vazifalar","Ijtimoiy himoya, tenglik, adolat va farovonlik.","#/goals")}${card("scale","Faoliyat yo‘nalishlari","Qonun ijodkorligi, muammolarni o‘rganish, saylovlar.","#/activity")}${card("file","Ustav va rasmiy hujjatlar","Ustav va 2024-yilgi saylovoldi dasturi havolalari.","#/docs")}${card("globe","Partiyaning rasmiy sayti","xdp.uz saytiga o‘tish.",L.site,1)}</div>`,
"/about":()=>page("Partiya haqida","XDP haqida","Partiya, uning yo‘nalishi va Ustavdagi maqsadi.",`<div class="prose"><p>O‘zbekiston Xalq demokratik partiyasi — O‘zbekistondagi siyosiy partiyalardan biri bo‘lib, o‘z faoliyatida ijtimoiy himoya, ijtimoiy tenglik va adolat masalalariga alohida e’tibor qaratadi.</p><p>Partiyaning Ustavida uning asosiy maqsadi davlat va jamiyat tomonidan ijtimoiy himoya hamda qo‘llab-quvvatlashga ehtiyojmand aholi qatlamlari manfaatlarini vakillik organlarida himoya qilish sifatida belgilangan.</p></div><div class="btns" style="justify-content:flex-start;margin-top:34px"><a class="btn p" href="${L.ustav}" target="_blank" rel="noopener noreferrer">Partiya Ustavi</a><a class="btn s" href="#/docs">Barcha hujjatlar</a></div>`),
"/history":()=>page("Partiya tarixi","XDP tarixi","Partiya qachon tashkil etilgani va qanday asosda ishlashi haqida.",`<div class="date">1991<small>1-NOYABR</small></div><div class="prose" style="margin-top:34px"><p>O‘zbekiston Xalq demokratik partiyasi 1991-yil 1-noyabrda tashkil etilgan.</p><p>Partiya o‘z faoliyatini siyosiy partiyalar to‘g‘risidagi qonunchilik va o‘z Ustavi asosida olib boradi.</p></div><div class="tl"><b>1991-yil, 1-noyabr</b><p>Partiya tashkil etildi.</p><p class="todo">Keyingi bosqichlar tekshirilgan manbalar asosida shu yerga qo‘shiladi.</p></div><p class="note">To‘liq tarix: ${src(L.history,"xdp.uz/history")}</p>`),
"/goals":()=>page("Maqsad va vazifalar","Maqsad va vazifalar","Partiya e’tibor qaratadigan to‘rt asosiy yo‘nalish.",`<div class="grid">${[["shield","Ijtimoiy himoya","Yordamga muhtoj fuqarolar manfaatlarini himoya qilish va ularni ijtimoiy qo‘llab-quvvatlash masalalari."],["eq","Ijtimoiy tenglik","Jamiyatda ijtimoiy tenglik tamoyillarini ilgari surishga qaratilgan yondashuvlar."],["scale","Ijtimoiy adolat","Fuqarolarning ijtimoiy huquq va manfaatlariga e’tibor qaratish."],["heart","Aholi farovonligi","Aholining turmush sharoitlarini yaxshilashga qaratilgan siyosiy tashabbuslar."]].map(c=>card(c[0],c[1],c[2],L.ustav,1)).join("")}</div>`),
"/activity":()=>page("Faoliyat","XDP faoliyati","Partiya ishlaydigan asosiy yo‘nalishlar.",`<div class="grid">${[["scale","Qonun ijodkorligida ishtirok","Partiya vakillari parlament va mahalliy vakillik organlaridagi faoliyati orqali qonunlar hamda boshqa huquqiy hujjatlarni ishlab chiqish va qabul qilish jarayonlarida qatnashadi."],["users","Fuqarolar muammolarini o‘rganish","Hududlardagi ijtimoiy-iqtisodiy va ijtimoiy-siyosiy vaziyatni o‘rganish, mavjud muammolarni aniqlash va ularni hal etishga qaratilgan takliflar ishlab chiqish vazifalari belgilangan."],["file","Saylovlarda ishtirok etish","Partiya qonunchilikda belgilangan tartibda saylov jarayonlarida ishtirok etadi."]].map(c=>card(c[0],c[1],c[2],L.site,1)).join("")}</div>
<h2 style="font-size:clamp(1.6rem,4.5vw,2.6rem);margin:70px 0 14px">Ustuvor yo‘nalishlar</h2><p class="lead" style="margin-bottom:26px">2024-yilgi saylovoldi dasturida yoritilgan masalalar. Bu partiyaning bugungi barcha rasmiy pozitsiyalarining to‘liq ro‘yxati emas.</p>
<div class="grid">${[["shield","Ijtimoiy himoya"],["scale","Ijtimoiy adolat"],["heart","Kambag‘allikni qisqartirish"],["users","Bandlik"],["globe","Ijtimoiy xizmatlar"]].map(c=>card(c[0],c[1],"2024-yilgi saylovoldi dasturidagi yo‘nalish.",L.dastur,1)).join("")}</div>`),
"/docs":()=>page("Hujjatlar","Hujjatlar va rasmiy manbalar","Partiyaning rasmiy sahifalari yangi oynada ochiladi.",`<div class="grid">${card("globe","XDP rasmiy sayti","Partiyaning asosiy rasmiy veb-sayti.",L.site,1)}${card("file","Partiya tarixi","Rasmiy saytdagi tarix sahifasi.",L.history,1)}${card("file","Partiya Ustavi","Maqsad va vazifalar belgilangan asosiy hujjat.",L.ustav,1)}${card("scale","2024-yilgi saylovoldi dasturi","2024-yilgi saylovoldi dasturi (tarixiy hujjat).",L.dastur,1)}</div>`),
"/contact":()=>page("Aloqa","Aloqa","Tasdiqlangan aloqa ma’lumotlari hozircha kiritilmagan.",`<div class="grid">${card("globe","Rasmiy sayt","Aloqa va yangiliklar uchun partiyaning rasmiy saytiga o‘ting.",L.site,1)}</div><p class="note">Tadbir tashkilotchilari tasdiqlagan telefon yoki manzil berilsa, shu bo‘limga qo‘shiladi.</p>`)
};
/* ===== ROUTER ===== */
const app=$("#app"),nav=$("#nav"),burger=$("#burger");
$("#nav ul").innerHTML=NAV.map(n=>`<li><a href="#${n[0]}">${n[1]}</a></li>`).join("");
$("#ft").innerHTML=`<b>O‘ZBEKISTON XALQ DEMOKRATIK PARTIYASI</b><div><a href="${L.site}" target="_blank" rel="noopener noreferrer">Rasmiy sayt</a><a href="${L.history}" target="_blank" rel="noopener noreferrer">Partiya tarixi</a><a href="#/docs">Ustav va hujjatlar</a><button type="button" id="replay">Kirish animatsiyasini qayta ko‘rish</button></div>`;
function route(){const p=(location.hash.slice(1)||"/").replace(/\/$/,"")||"/";const r=PAGES[p]||PAGES["/"];
 app.innerHTML=r();app.className="anim";document.querySelectorAll("nav a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")==="#"+(PAGES[p]?p:"/")));
 nav.classList.remove("open");burger.setAttribute("aria-expanded","false");scrollTo(0,0);
 document.title=(p==="/"?"":(NAV.find(n=>n[0]===p)||[0,""])[1]+" — ")+"O‘zbekiston Xalq demokratik partiyasi"}
addEventListener("hashchange",route);
burger.onclick=()=>{const o=nav.classList.toggle("open");burger.setAttribute("aria-expanded",o)};
/* ===== KIRISH SAHNASI ===== */
const intro=$("#intro"),stage=$("#stage");let run=0,timers=[];
const sleep=(ms,id)=>new Promise((res,rej)=>{const t=setTimeout(()=>id===run?res():rej(),ms);timers.push(t)});
function reveal(){["hdr","app","ft"].forEach(i=>$("#"+i).hidden=false);route()}
function finish(){run++;timers.forEach(clearTimeout);timers=[];intro.classList.add("out");reveal();setTimeout(()=>{if(intro.classList.contains("out"))intro.hidden=true},1700);document.body.style.overflow=""}
async function play(){const id=++run;timers.forEach(clearTimeout);timers=[];
 intro.hidden=false;intro.classList.remove("out");stage.innerHTML="";document.body.style.overflow="hidden";
 const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
 try{await sleep(rm?300:600,id);
  for(const[t,c,hold,g,lv]of SCENES){const el=document.createElement("div");el.className="w "+c;el.textContent=t;el.style.setProperty("--g",g);intro.style.setProperty("--lv",lv);stage.appendChild(el);
   void el.offsetWidth;el.classList.add("on");await sleep(rm?Math.min(hold,1600):hold,id);
   el.classList.remove("on");el.classList.add("off");await sleep(rm?200:900,id);el.remove();await sleep(rm?0:150,id)}
  intro.style.setProperty("--lv",0);await sleep(600,id);finish()}catch(e){/* bekor qilindi */}}
$("#skip").onclick=finish;
$("#ft").addEventListener("click",e=>{if(e.target.id==="replay"){scrollTo(0,0);play()}});
addEventListener("pagehide",()=>{run++;timers.forEach(clearTimeout)});
/* ===== BOSHLASH ===== */
if(LOGO_SRC)document.querySelector(".brand .logo").innerHTML=`<img src="${LOGO_SRC}" alt="XDP logotipi">`;
const h=location.hash.slice(1);
if(h&&h!=="/"){intro.hidden=true;reveal()}else play();
</script>
</body>
</html>
